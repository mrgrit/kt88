name: kt88
x-base: &base
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
services:
  fw:
    <<: *base
    build: {context: '.', dockerfile: security/router.Dockerfile}
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: {net.ipv4.ip_forward: '1', net.ipv4.conf.all.rp_filter: '0'}
    environment: {ROUTER_ROLE: fw}
    networks:
      ext: {ipv4_address: 10.88.30.2, gw_priority: 10}
      pipe: {ipv4_address: 10.88.31.1}
    ports:
      - '${WEB_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes: ['./.runtime/policies:/policies', './.runtime/logs/fw:/var/log/kt88']
  ips:
    <<: *base
    build: {context: '.', dockerfile: security/router.Dockerfile}
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: {net.ipv4.ip_forward: '1', net.ipv4.conf.all.rp_filter: '0'}
    environment: {ROUTER_ROLE: ips}
    networks:
      pipe: {ipv4_address: 10.88.31.2}
      dmz: {ipv4_address: 10.88.32.1}
    volumes: ['./.runtime/policies:/policies', './.runtime/logs/ips:/var/log/suricata']
  edge:
    <<: *base
    build: {context: '.', dockerfile: security/edge.Dockerfile}
    cap_add: [NET_ADMIN]
    environment:
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-platform.example.internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
    networks:
      dmz: {ipv4_address: 10.88.32.80}
      frontend: {ipv4_address: 10.88.33.80}
    volumes: [caddy_data:/data, caddy_config:/config, ./.runtime/policies:/policies]
  waf:
    <<: *base
    build: {context: '.', dockerfile: security/waf.Dockerfile}
    networks:
      frontend: {ipv4_address: 10.88.33.81}
      backend: {ipv4_address: 10.88.34.81}
    volumes: ['./.runtime/policies:/policies', './.runtime/logs/waf:/var/log/apache2']
  control:
    <<: *base
    build: {context: '.', dockerfile: control/Dockerfile}
    networks:
      backend: {ipv4_address: 10.88.34.2}
      apps: {ipv4_address: 10.88.40.2}
      management: {ipv4_address: 10.88.60.2}
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_MUST_CHANGE: '1'
      AGENT_TOKEN_FILE: /run/secrets/agent_token
      DATA_DIR: /data
      POLICY_DIR: /policies
      ENDPOINT_CIDRS: 10.88.40.0/24
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-platform.example.internal}
      SITE_DOMAIN: ${SITE_DOMAIN:-example.internal}
      SITE_VISIBILITY: ${SITE_VISIBILITY:-internal}
      BOOTSTRAP_UPSTREAM: ${BOOTSTRAP_UPSTREAM:-}
    secrets: [admin_password, agent_token]
    volumes: ['./.runtime/data:/data', './.runtime/policies:/policies']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/_kt88/healthz")']
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  ext: {ipam: {config: [{subnet: 10.88.30.0/24, gateway: 10.88.30.254}]}}
  pipe: {internal: true, ipam: {config: [{subnet: 10.88.31.0/24, gateway: 10.88.31.254}]}}
  dmz: {internal: true, ipam: {config: [{subnet: 10.88.32.0/24, gateway: 10.88.32.254}]}}
  frontend: {internal: true, ipam: {config: [{subnet: 10.88.33.0/24}]}}
  backend: {internal: true, ipam: {config: [{subnet: 10.88.34.0/24}]}}
  apps: {internal: true, ipam: {config: [{subnet: 10.88.40.0/24}]}}
  management: {internal: true, ipam: {config: [{subnet: 10.88.60.0/24}]}}
volumes: {caddy_data: {}, caddy_config: {}}
secrets:
  admin_password: {file: ./.secrets/admin_password}
  agent_token: {file: ./.secrets/agent_token}
