SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 22020096
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial
SecTmpDir /tmp
SecDataDir /tmp
SecAuditEngine RelevantOnly
SecAuditLogFormat JSON
SecAuditLogType Serial
# Do not log request/response bodies or headers with credentials.
SecAuditLogParts AHZ
SecAuditLog /var/log/apache2/modsec_audit.log
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecRule REQUEST_HEADERS:Content-Type "application/json" "id:200001,phase:1,pass,nolog,t:lowercase,ctl:requestBodyProcessor=JSON"
Include /opt/owasp-crs/crs-setup.conf
# REST verbs are allowed only on application and platform API paths.
SecRule REQUEST_URI "@rx ^/(?:api/|_kt88/)" "id:200002,phase:1,pass,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
# Wazuh index-pattern field metadata contains literal OS paths and command names.
# Exclude only that inert JSON field on the native saved-object registration route.
# Platform authentication and Wazuh authorization still protect every request.
SecRule REQUEST_FILENAME "@rx ^/_kt88/wazuh/api/saved_objects/index-pattern/[A-Za-z0-9_*.-]+$" "id:200003,phase:1,pass,nolog,chain"
 SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:attributes.fields"
# Discover deliberately requests an unfragmented highlight with INT_MAX.
# Keep integer-overflow inspection everywhere else, including other field values.
SecRule REQUEST_FILENAME "@rx ^/_kt88/wazuh/internal/search/opensearch(?:-with-long-numerals)?$" "id:200004,phase:2,pass,nolog,chain"
 SecRule REQUEST_METHOD "@streq POST" "chain"
 SecRule ARGS:params.body.highlight.fragment_size "@streq 2147483647" "ctl:ruleRemoveTargetById=942220;ARGS:params.body.highlight.fragment_size"
Include /policies/waf.conf
Include /opt/owasp-crs/rules/*.conf
