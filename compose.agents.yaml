services:
  control:
    environment:
      INDEXER_URL: ${INDEXER_URL:-}
      INDEXER_CA: /certs/root-ca.pem
      SIEM_READER_USER: soc-reader
      SIEM_READER_PASSWORD_FILE: /run/secrets/siem_reader_password
      WAZUH_DASHBOARD_URL: https://wazuh.dashboard:5601
      WAZUH_DASHBOARD_PASSWORD_FILE: /run/secrets/wazuh_dashboard_password
    secrets: [siem_reader_password, wazuh_dashboard_password]
    volumes: ['./.runtime/certs:/certs:ro']
  operation-agents:
    build: {context: '.', dockerfile: control/Dockerfile}
    restart: unless-stopped
    command: [python, -m, control.runner]
    networks: [backend, management, models]
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      AGENT_TOKEN_FILE: /run/secrets/agent_token
      DATA_DIR: /data
      AGENT_WORKSPACE: /workspace
      AGENT_MODELS: ${AGENT_MODELS:-qwen3:8b,qwen3:14b}
      LLM_URL: ${LLM_URL:-}
      MODEL_HTTP_HOST: ${MODEL_HTTP_HOST:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      AGENT_INTERVAL: '900'
    secrets: [admin_password, agent_token]
    volumes: ['./.runtime/data:/data', './.runtime/agent-workspace:/workspace:ro']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
networks:
  models: {internal: true}
secrets:
  wazuh_dashboard_password: {file: ./.secrets/siem_admin_password}
  siem_reader_password: {file: ./.secrets/siem_reader_password}
