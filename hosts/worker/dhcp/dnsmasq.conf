# 내부망(int) DHCP 서버.
#
# 리눅스 엔드포인트는 compose 가 IP 를 고정 배정하지만, 윈도우 엔드포인트는 VM 안에서
# 부팅하므로 스스로 주소를 받아야 한다. 그래서 이 망에만 DHCP 를 둔다.
#
# 주소 배분 규칙
#   10.30.30.1        게이트웨이 (코어의 IPS)
#   10.30.30.2        이 DHCP 서버
#   10.30.30.11-49    고정 배정 (compose 가 지정하는 리눅스 엔드포인트)
#   10.30.30.100-149  DHCP 동적 배정 (윈도우 등 스스로 받아가는 단말)

port=0                          # DNS 기능 끔 — DHCP 전용
interface=eth0
bind-interfaces

dhcp-range=10.30.30.100,10.30.30.149,12h
dhcp-option=option:router,10.30.30.1        # 게이트웨이 = IPS
dhcp-option=option:dns-server,8.8.8.8
dhcp-authoritative

log-dhcp
