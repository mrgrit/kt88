name: kt88-worker

# worker(192.168.0.203) — 내부망(int) 업무 엔드포인트가 올라가는 호스트.
#
# 호스트 커널 설정은 아무것도 필요 없다. macvlan 네트워크 하나를 정의하면 컨테이너가
# 내부망에 자기 IP 로 직접 붙고, 게이트웨이는 코어의 IPS 다.
# 엔드포인트를 늘리려면 services 에 한 항목씩 추가하면 된다.

services:
  ep-linux-01:
    container_name: kt88-ep-linux-01
    build: ../../endpoint
    image: kt88-endpoint:latest
    hostname: ep-linux-01
    environment:
      AGENT_NAME: ep-linux-01
    networks:
      int: { ipv4_address: 10.30.30.11 }
    restart: unless-stopped

  ep-linux-02:
    container_name: kt88-ep-linux-02
    image: kt88-endpoint:latest
    depends_on: [ep-linux-01]      # 이미지 빌드를 한 번만 하기 위해
    hostname: ep-linux-02
    environment:
      AGENT_NAME: ep-linux-02
    networks:
      int: { ipv4_address: 10.30.30.12 }
    restart: unless-stopped

  # ╭─ 내부망 DHCP — 윈도우처럼 VM 안에서 부팅해 스스로 주소를 받는 단말용 ──╮
  dhcp:
    container_name: kt88-dhcp
    build: ./dhcp
    hostname: dhcp
    cap_add: [NET_ADMIN]
    networks:
      int: { ipv4_address: 10.30.30.2 }
    restart: unless-stopped

  # ╭─ 윈도우 엔드포인트 — 컨테이너 안의 QEMU/KVM 에서 실행 ────────────────╮
  # macvlan 인터페이스를 VM 에 그대로 넘겨(DHCP=Y) 윈도우가 내부망의 정식 구성원이
  # 된다. 그래서 공격 대상도 되고, Wazuh 에이전트로 감시 대상도 된다.
  #
  # 최초 기동 시 윈도우 이미지를 내려받고 무인 설치한다(수 GB, 회선에 따라 오래 걸림).
  # 진행 상황은 http://192.168.0.203:8006 에서 볼 수 있다.
  windows:
    container_name: kt88-ep-win-01
    image: dockurr/windows
    hostname: ep-win-01
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      DHCP: "Y"              # macvlan 을 VM 에 패스스루 → 내부망에서 직접 주소를 받는다
    devices:
      - /dev/kvm
      - /dev/net/tun
    device_cgroup_rules:
      - 'c *:* rwm'
    cap_add: [NET_ADMIN]
    stop_grace_period: 2m
    volumes:
      - windows-data:/storage
      - ./windows/oem:/oem:ro   # 최초 부팅 시 install.bat 자동 실행 (Wazuh 에이전트)
    networks:
      # 컨테이너 자신의 주소. VM(윈도우)은 이것과 별개로 DHCP 로 .100-149 를 받는다.
      # 콘솔(nginx :8006)은 이 주소에서 열린다.
      int: { ipv4_address: 10.30.30.3 }
    restart: unless-stopped

  # ╭─ 콘솔 접근 프록시 ────────────────────────────────────────────────╮
  # macvlan 컨테이너는 포트 publish 가 동작하지 않는다. 그래서 랩 안(macvlan)과
  # 호스트(bridge) 양쪽에 다리를 걸친 중계를 두고, 강사가 밖에서 콘솔을 볼 수 있게 한다.
  # 코어에서 Wazuh 대시보드를 여는 방식과 같은 구조다.
  console-proxy:
    container_name: kt88-console-proxy
    image: alpine/socat
    command: TCP-LISTEN:8006,fork,reuseaddr TCP:10.30.30.3:8006
    ports:
      - "8006:8006"          # 강사 브라우저 → http://192.168.0.203:8006
    networks:
      admin: {}
      int:   { ipv4_address: 10.30.30.4 }
    restart: unless-stopped

networks:
  # 관리자 접근 전용 — 포트 publish 를 위한 bridge.
  #
  # ※ 이름이 'kt88-admin' 인 것이 중요하다. docker 는 컨테이너가 붙은 네트워크를
  #   이름순으로 정렬해 첫 번째를 포트 publish 대상으로 삼는다. macvlan 망 이름이
  #   앞서면 publish 를 통째로 건너뛰는데, 에러도 경고도 없이 조용히 실패한다
  #   (docker port 는 비고 DNAT 룰이 안 생긴다). 실측으로 확인한 동작이다:
  #     aa-bridge + kt88-int → DNAT 생성 O
  #     zz-bridge + kt88-int → DNAT 생성 X
  #   'kt88-admin' 은 app/dmz/ext/int/mgmt/res 어느 것보다 앞서므로 안전하다.
  #   compose 의 priority 로는 해결되지 않는다(시도했으나 효과 없음).
  admin:
    name: kt88-admin
    driver: bridge

  int:
    name: kt88-int
    driver: macvlan
    driver_opts: { parent: enp1s0 }
    ipam:
      config: [{ subnet: 10.30.30.0/24, gateway: 10.30.30.1 }]

volumes:
  windows-data:
