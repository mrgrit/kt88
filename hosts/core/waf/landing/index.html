<h1>kt88 실습 랩</h1>
<p>이 페이지는 WAF(Apache + ModSecurity)가 응답했다. 아래 사이트는 모두
   <code>외부망 → 방화벽 → IPS → WAF → 웹앱</code> 경로를 지난다.</p>
<ul>
  <li><code>juice.kt88.lab</code> 또는 <code>:8001</code> — OWASP Juice Shop</li>
  <li><code>dvwa.kt88.lab</code> 또는 <code>:8002</code> — DVWA</li>
</ul>
<p>hosts 파일에 <code>10.30.20.80 juice.kt88.lab dvwa.kt88.lab</code> 를 추가하면
   이름으로 접근할 수 있다.</p>
