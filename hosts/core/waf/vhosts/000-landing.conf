# 매칭되는 Host 가 없을 때 응답하는 기본 사이트.
<VirtualHost *:80>
    ServerName kt88.lab
    ServerAlias landing www.kt88.lab _default_
    DocumentRoot /var/www/landing

    <Directory /var/www/landing>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/landing_error.log
    CustomLog ${APACHE_LOG_DIR}/landing_access.log combined
</VirtualHost>
