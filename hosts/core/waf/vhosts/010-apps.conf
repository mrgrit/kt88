# 취약 웹앱 — WAF 가 HTTP 를 종료하고 app 세그먼트로 넘긴다.
#
# 학생 PC 의 hosts 파일에 아래를 넣으면 이름으로 접근된다(외부망 공격자도 동일):
#   10.30.20.80  juice.kt88.lab  dvwa.kt88.lab
#
# 포트로도 접근 가능하게 병행한다(hosts 수정이 어려운 환경 대비) — 200-ports.conf.

<VirtualHost *:80>
    ServerName juice.kt88.lab
    ProxyPreserveHost On
    ProxyPass        / http://10.30.50.11:3000/
    ProxyPassReverse / http://10.30.50.11:3000/

    ErrorLog  ${APACHE_LOG_DIR}/juice_error.log
    CustomLog ${APACHE_LOG_DIR}/juice_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName dvwa.kt88.lab
    ProxyPreserveHost On
    ProxyPass        / http://10.30.50.12:80/
    ProxyPassReverse / http://10.30.50.12:80/

    ErrorLog  ${APACHE_LOG_DIR}/dvwa_error.log
    CustomLog ${APACHE_LOG_DIR}/dvwa_access.log combined
</VirtualHost>
