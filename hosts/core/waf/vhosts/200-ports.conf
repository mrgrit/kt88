# 포트분기 — hosts 파일을 못 고치는 환경에서도 접근 가능하게.
#   10.30.20.80:8001  juice-shop
#   10.30.20.80:8002  DVWA
Listen 8001
Listen 8002

<VirtualHost *:8001>
    ProxyPreserveHost On
    ProxyPass        / http://10.30.50.11:3000/
    ProxyPassReverse / http://10.30.50.11:3000/
    ErrorLog  ${APACHE_LOG_DIR}/juice_port_error.log
    CustomLog ${APACHE_LOG_DIR}/juice_port_access.log combined
</VirtualHost>

<VirtualHost *:8002>
    ProxyPreserveHost On
    ProxyPass        / http://10.30.50.12:80/
    ProxyPassReverse / http://10.30.50.12:80/
    ErrorLog  ${APACHE_LOG_DIR}/dvwa_port_error.log
    CustomLog ${APACHE_LOG_DIR}/dvwa_port_access.log combined
</VirtualHost>
