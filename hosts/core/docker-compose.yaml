name: kt88-core

# 코어(192.168.0.202) — 보안장비가 도는 호스트.
#
# 패킷 흐름(불변):  외부망 → fw → ips → (dmz 의 waf) → 웹서버
#                                    └→ 내부망 / 연구망
#
# el34 의 체인을 그대로 계승한다. fw 는 경계(외부망 + 인터넷), ips 는 내부 구간의
# 게이트웨이다. 그래서 외부에서 내부로 들어오는 모든 패킷은 fw 를 지난 뒤 반드시
# ips 를 지난다 — 우회 경로가 없다.
#
# fw ─── pipe(bridge, 10.30.1.0/24) ─── ips
#  │                                     ├ 10.30.20.1  DMZ
#  ├ 10.30.10.1  외부망                   ├ 10.30.30.1  내부망
#  └ WAN (인터넷, NAT)                    └ 10.30.40.1  연구망
#
# ※ macvlan 의 gateway 선언은 docker IPAM 이 예약한다. 실제 게이트웨이 .1 은 장비
#   컨테이너가 직접 가져야 하므로 선언은 쓰지 않는 .254 로 두고 .1 을 고정 할당한다.
#   (엔드포인트 호스트에서는 .1 을 그대로 gateway 로 선언한다.)

services:
  # ╭─ 경계 방화벽 — 외부망 ↔ 내부 구간, 인터넷 NAT ────────────╮
  fw:
    container_name: kt88-fw
    build: ./fw
    hostname: fw
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      # 모든 망이 하나의 물리 L2 를 공유하므로, 리다이렉트를 켜두면 방화벽이
      # "나 말고 직접 가라"고 알려주어 스스로를 우회시킨다. 표준 하드닝 항목.
      net.ipv4.conf.all.send_redirects: "0"
    environment:
      IPS_PIPE_IP: 10.30.1.2
    networks:
      ext:    { ipv4_address: 10.30.10.1 }
      pipe:   { ipv4_address: 10.30.1.1 }
      uplink: {}
    restart: unless-stopped

  # ╭─ IPS — 내부 구간의 게이트웨이 + Suricata 침입탐지/차단 ────╮
  ips:
    container_name: kt88-ips
    build: ./ips
    hostname: ips
    depends_on: [fw]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
    environment:
      FW_PIPE_IP: 10.30.1.1
    networks:
      pipe: { ipv4_address: 10.30.1.2 }
      dmz:  { ipv4_address: 10.30.20.1 }
      int:  { ipv4_address: 10.30.30.1 }
      res:  { ipv4_address: 10.30.40.1 }
    volumes:
      - suricata-logs:/var/log/suricata
    restart: unless-stopped

networks:
  # fw ↔ ips 를 잇는 구간. 장비끼리만 쓰는 내부 회선이라 bridge 로 충분하다.
  pipe:
    name: kt88-pipe
    driver: bridge
    ipam:
      config: [{ subnet: 10.30.1.0/24, gateway: 10.30.1.254 }]

  # WAN — 인터넷으로 나가는 통로.
  uplink:
    name: kt88-uplink
    driver: bridge

  ext:
    name: kt88-ext
    driver: macvlan
    driver_opts: { parent: enp1s0 }
    ipam:
      config: [{ subnet: 10.30.10.0/24, gateway: 10.30.10.254 }]
  dmz:
    name: kt88-dmz
    driver: macvlan
    driver_opts: { parent: enp1s0 }
    ipam:
      config: [{ subnet: 10.30.20.0/24, gateway: 10.30.20.254 }]
  int:
    name: kt88-int
    driver: macvlan
    driver_opts: { parent: enp1s0 }
    ipam:
      config: [{ subnet: 10.30.30.0/24, gateway: 10.30.30.254 }]
  res:
    name: kt88-res
    driver: macvlan
    driver_opts: { parent: enp1s0 }
    ipam:
      config: [{ subnet: 10.30.40.0/24, gateway: 10.30.40.254 }]

volumes:
  suricata-logs:
