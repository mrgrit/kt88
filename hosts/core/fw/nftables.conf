#!/usr/sbin/nft -f
# kt88 경계 방화벽 정책 — 기본 차단(default deny), 필요한 것만 명시 허용.
#
# fw 가 맡는 것은 '경계'다: 외부망 ↔ 내부 구간, 그리고 인터넷 방향 NAT.
# 내부 구간(DMZ/내부망/연구망) 사이의 통제는 ips 가 맡는다 — 그 세 망이 만나는
# 지점이 ips 이기 때문이다. (2계층 방화벽 구조)
#
#   ext 10.30.10.0/24  외부망 — 공격자        ← fw 에 직접 연결
#   dmz 10.30.20.0/24  DMZ   — 공개 웹서버    ┐
#   int 10.30.30.0/24  내부망 — 업무 엔드포인트 ├ pipe 건너 ips 뒤
#   res 10.30.40.0/24  연구망 — 분석/샌드박스  ┘

flush ruleset

table inet kt88 {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # 이미 허용된 연결의 응답 패킷
        ct state established,related accept

        # 외부망 → DMZ : 웹 서비스만 공개
        ip saddr 10.30.10.0/24 ip daddr 10.30.20.0/24 tcp dport { 80, 443 } accept

        # 외부망 → 내부망 / 연구망 : 차단 (로그를 남겨 실습에서 확인 가능하게)
        ip saddr 10.30.10.0/24 ip daddr { 10.30.30.0/24, 10.30.40.0/24 } \
            counter log prefix "[kt88-fw] ext->inside DROP " drop

        # 내부 구간 → 외부망 : 허용
        ip saddr { 10.30.20.0/24, 10.30.30.0/24, 10.30.40.0/24 } \
            ip daddr 10.30.10.0/24 accept

        # 내부 구간 → 인터넷 : 허용 (랩 대역이 아닌 목적지가 인터넷이다)
        ip saddr { 10.30.20.0/24, 10.30.30.0/24, 10.30.40.0/24 } \
            ip daddr != 10.30.0.0/16 accept

        # 외부망 → 인터넷 : 공격자도 도구를 받아야 하므로 허용
        ip saddr 10.30.10.0/24 ip daddr != 10.30.0.0/16 accept

        # 진단용 ICMP 는 전 구간 허용 (실습 편의)
        ip protocol icmp accept
    }
}

# 인터넷으로 나갈 때만 출발지를 바꾼다. 실제 마스커레이드 룰은 entrypoint 가
# WAN 인터페이스를 판별한 뒤 넣는다. 랩 내부끼리는 NAT 하지 않는다 —
# SIEM 과 WAF 가 진짜 출발지를 봐야 하기 때문.
table ip kt88_nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
    }
}
