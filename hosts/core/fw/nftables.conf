#!/usr/sbin/nft -f
# kt88 방화벽 정책 — 기본 차단(default deny), 필요한 것만 명시 허용.
#
# 망 구성
#   ext 10.30.10.0/24  외부망 — 공격자
#   dmz 10.30.20.0/24  DMZ   — 공개 웹서버
#   int 10.30.30.0/24  내부망 — 업무 엔드포인트
#   res 10.30.40.0/24  연구망 — 분석/샌드박스

flush ruleset

table inet kt88 {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }

    # 망 간 통신은 전부 이 체인을 지난다 — 방화벽이 모든 망의 게이트웨이이기 때문.
    chain forward {
        type filter hook forward priority 0; policy drop;

        # 이미 허용된 연결의 응답 패킷
        ct state established,related accept

        # 외부망 → DMZ : 웹 서비스만 공개
        ip saddr 10.30.10.0/24 ip daddr 10.30.20.0/24 tcp dport { 80, 443 } accept

        # 외부망 → 내부망 : 차단 (policy drop 이 처리 — 명시적으로 남겨 교육용 로그)
        ip saddr 10.30.10.0/24 ip daddr 10.30.30.0/24 log prefix "[kt88] ext->int DROP " drop

        # 내부망 → DMZ / 외부망 : 업무 통신 허용
        ip saddr 10.30.30.0/24 ip daddr 10.30.20.0/24 accept
        ip saddr 10.30.30.0/24 ip daddr 10.30.10.0/24 accept

        # 연구망 : 내부망과 상호 격리 (샌드박스가 업무망을 오염시키지 못하게)
        ip saddr 10.30.40.0/24 ip daddr 10.30.30.0/24 log prefix "[kt88] res->int DROP " drop
        ip saddr 10.30.30.0/24 ip daddr 10.30.40.0/24 log prefix "[kt88] int->res DROP " drop

        # 연구망 → DMZ : 분석 대상 접근 허용
        ip saddr 10.30.40.0/24 ip daddr 10.30.20.0/24 accept

        # 내부망/연구망 → 인터넷 (WAN) : 허용. 랩 대역이 아닌 목적지가 인터넷이다.
        ip saddr { 10.30.30.0/24, 10.30.40.0/24 } ip daddr != 10.30.0.0/16 accept

        # 진단용 ICMP 는 전 구간 허용 (실습 편의)
        ip protocol icmp accept
    }
}

# 인터넷으로 나갈 때만 출발지를 바꾼다. 실제 마스커레이드 룰은 entrypoint 가
# WAN 인터페이스를 판별한 뒤 넣는다.
table ip kt88_nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
    }
}
