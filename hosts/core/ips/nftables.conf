#!/usr/sbin/nft -f
# kt88 IPS — 내부 구간 접근통제.
#
# DMZ / 내부망 / 연구망이 만나는 지점이 여기다. 경계(외부망·인터넷) 통제는 fw 가
# 맡고, 내부 구간끼리의 통제는 이 파일이 맡는다. 2계층 방화벽 구조.
#
#   dmz 10.30.20.0/24  DMZ   — 공개 웹서버
#   int 10.30.30.0/24  내부망 — 업무 엔드포인트
#   res 10.30.40.0/24  연구망 — 분석/샌드박스

flush ruleset

table inet kt88_ips {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        ct state established,related accept

        # 연구망 ↔ 내부망 상호 격리 — 샌드박스가 업무망을 오염시키지 못하게.
        ip saddr 10.30.40.0/24 ip daddr 10.30.30.0/24 \
            counter log prefix "[kt88-ips] res->int DROP " drop
        ip saddr 10.30.30.0/24 ip daddr 10.30.40.0/24 \
            counter log prefix "[kt88-ips] int->res DROP " drop

        # 웹앱(app)으로 향하는 모든 통과 트래픽 차단 — 웹앱은 WAF 를 통해서만
        # 도달할 수 있어야 한다. WAF 는 app 세그먼트에 다리를 걸치고 있어
        # 프록시 트래픽이 ips 를 지나지 않으므로 이 룰에 걸리지 않는다.
        ip daddr 10.30.50.0/24 \
            counter log prefix "[kt88-ips] ->app DROP (WAF 우회 시도) " drop

        # 나머지(내부망→DMZ, 연구망→DMZ, 웹앱→인터넷, 외부 방향)는 허용.
        # 경계 통제는 fw 가 이미 했으므로 여기서 다시 막지 않는다.
    }
}
